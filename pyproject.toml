[project]
name = "sycomo"
version = "0.1.0"
description = "Construction choices and intervention transfer in sycophancy model organisms (LoRA rank x benign fraction grid, n x n directional-ablation transfer matrix)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.11.0",          # cu128 build on Linux (see [tool.uv.sources]); RunPod hosts need driver >= 12.8
    "transformers>=5.16,<6",  # code uses the v5 `dtype=` / tokenizer APIs
    "peft>=0.21,<0.22",
    "accelerate>=1.10",
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sycomo"]

# Exact CUDA build of torch on Linux pods, plain PyPI wheel elsewhere (macOS smoke runs).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
